<rect x="601" y="186" width="178" height="172" rx="14" fill="#FFEDD5"/>
<rect x="615" y="198" width="54" height="25" rx="12.5" fill="#EA580C"/><text x="642.0" y="215.18" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">확장</text>
<text x="615" y="252" font-size="18" fill="#10285A" font-weight="800" text-anchor="start">전기차 충전소</text>
<text x="615" y="282" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">SafeRange를</text>
<text x="615" y="305" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">배터리·전비로</text>
<text x="615" y="328" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">충전기 상태 추가</text>
