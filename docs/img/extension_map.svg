<text x="42" y="252" font-size="18" fill="#10285A" font-weight="800" text-anchor="start">주유소</text>
<text x="42" y="282" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">연료 제약: SafeRange</text>
<text x="42" y="305" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">가격 비교: 최저가</text>
<text x="42" y="328" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">6,904곳</text>
<line x1="308" y1="166" x2="308" y2="186" stroke="#0B9B83" stroke-width="3"/>
<rect x="219" y="186" width="178" height="172" rx="14" fill="#E6F6F2" stroke="#0B9B83" stroke-width="1.5"/>
<rect x="233" y="198" width="54" height="25" rx="12.5" fill="#0B9B83"/><text x="260.0" y="215.18" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">구현</text>
<text x="233" y="252" font-size="18" fill="#10285A" font-weight="800" text-anchor="start">DT·휴게소</text>
<text x="233" y="282" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">ΔT 순 정렬</text>
<text x="233" y="305" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">양방향은 덜 도는 쪽</text>
<text x="233" y="328" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">983곳</text>
