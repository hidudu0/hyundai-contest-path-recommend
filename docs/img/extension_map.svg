<rect x="792" y="186" width="178" height="172" rx="14" fill="#FFEDD5"/>
<rect x="806" y="198" width="54" height="25" rx="12.5" fill="#EA580C"/><text x="833.0" y="215.18" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">확장</text>
<text x="806" y="252" font-size="18" fill="#10285A" font-weight="800" text-anchor="start">주문·픽업</text>
<text x="806" y="282" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">도착 시간에 맞춰</text>
<text x="806" y="305" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">미리 주문</text>
<text x="806" y="328" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">제휴 매장 연결</text>
<rect x="28" y="374" width="944" height="62" rx="14" fill="#F1F3F7"/>
<text x="52" y="411" font-size="14" fill="#6B7280" font-weight="700" text-anchor="start">예시</text>
<text x="104" y="411" font-size="15" fill="#10285A" font-weight="700" text-anchor="start">여행 중 밥 먹을 곳</text>
<rect x="262" y="390" width="130" height="30" rx="15.0" fill="#0B9B83"/><text x="327.0" y="410.04" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">+2분 DT 버거</text>
<rect x="404" y="390" width="130" height="30" rx="15.0" fill="#0B9B83"/><text x="469.0" y="410.04" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">+4분 DT 카페</text>
<rect x="546" y="390" width="124" height="30" rx="15.0" fill="#6B7280"/><text x="608.0" y="410.04" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">+11분 국밥집</text>
<text x="948" y="411" font-size="14" fill="#4B5563" font-weight="400" text-anchor="end">후보를 하나씩 경유지로 넣어 볼 필요가 없습니다</text>
</svg>
