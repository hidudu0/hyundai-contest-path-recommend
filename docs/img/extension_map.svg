<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="15">
<rect x="0.75" y="0.75" width="998.5" height="454.5" rx="16" fill="#FFFFFF" stroke="#E3E4EE" stroke-width="1.5"/>
<text x="32" y="50" font-size="26" fill="#10285A" font-weight="800" text-anchor="start">같은 엔진으로 들를 곳을 넓힙니다</text>
<text x="32" y="80" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start">거리를 보여 주는 지도가 아니라, 얼마나 돌아가는지 보여 주는 지도</text>
<rect x="28" y="102" width="944" height="64" rx="14" fill="#10285A"/>
<text x="500" y="130" font-size="15" fill="#C9D3E8" font-weight="700" text-anchor="middle">공통 엔진</text>
<text x="500" y="154" font-size="18" fill="#FFFFFF" font-weight="800" text-anchor="middle">경로 → 가는 길 후보 수집 → ΔT·ΔD 계산 → 경유지 추가</text>
<line x1="117" y1="166" x2="117" y2="186" stroke="#0B9B83" stroke-width="3"/>
<rect x="28" y="186" width="178" height="172" rx="14" fill="#E6F6F2" stroke="#0B9B83" stroke-width="1.5"/>
