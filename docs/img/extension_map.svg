<rect x="410" y="186" width="178" height="172" rx="14" fill="#FFEDD5"/>
<rect x="424" y="198" width="54" height="25" rx="12.5" fill="#EA580C"/><text x="451.0" y="215.18" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">확장</text>
<text x="424" y="252" font-size="18" fill="#10285A" font-weight="800" text-anchor="start">음식점·카페</text>
<text x="424" y="282" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">장소 데이터만 추가</text>
<text x="424" y="305" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">ΔT 순 정렬 그대로</text>
<text x="424" y="328" font-size="14" fill="#1F2340" font-weight="400" text-anchor="start">영업시간 필터</text>
