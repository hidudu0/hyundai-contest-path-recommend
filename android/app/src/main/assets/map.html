<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html, body, #map { margin: 0; height: 100%; background: #EEF1F6; font-family: sans-serif; }
.bar { position: absolute; top: 14px; left: 16px; right: 16px; z-index: 1000; display: flex; gap: 10px; align-items: center; pointer-events: none; }
.bar > * { background: rgba(255,255,255,.93); border-radius: 10px; padding: 6px 12px; font: 500 19px sans-serif; color: #4B5563; }
.bar b { margin-right: auto; color: #10285A; font-weight: 700; }
.bar i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
#all { position: absolute; right: 16px; bottom: 30px; z-index: 1000; border: 0; border-radius: 12px; padding: 12px 18px;
       background: #fff; color: #10285A; font: 700 20px sans-serif; box-shadow: 0 2px 8px rgba(16,40,90,.18); }
.leaflet-tooltip.tag { background: #fff; border: 3px solid currentColor; border-radius: 12px; padding: 1px 8px;
       font: 700 20px sans-serif; box-shadow: none; }
.leaflet-tooltip.tag:before { display: none; }
.leaflet-tooltip.pick { background: #10285A; color: #fff; border-color: #10285A; font-size: 22px; padding: 3px 10px; }
.leaflet-tooltip.note { border-width: 0; background: rgba(255,255,255,.9); }
.leaflet-container .leaflet-control-attribution { font-size: 11px; }
.leaflet-tile-pane { filter: saturate(.45) brightness(1.04); } /* calm base so route and stops stand out */
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <b>거리가 아니라, 얼마나 돌아가는지</b>
  <span><i style="background:#0B9B83"></i>3분 이내</span>
  <span><i style="background:#E9A100"></i>5분 이내</span>
  <span><i style="background:#9AA3B2"></i>그 이상</span>
  <span><i style="background:#F97316"></i>들렀다 가는 길</span>
</div>
<button id="all">전체 보기</button>
<script>L_DISABLE_3D = true; // the emulator WebView drops HTML labels on 3D-composited panes</script>
<script src="leaflet/leaflet.js"></script>
<script>
// Real map underneath: OpenStreetMap tiles (the app fetches and caches them, see MapView).
// Route, stops and labels are vectors, so they still draw when tiles cannot load.
var map = L.map('map', { zoomControl: false, zoomSnap: 0.25 }).setView([37.41, 127.09], 9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);

var plan = L.layerGroup().addTo(map), leg = L.layerGroup().addTo(map), carDot = null, overview = null;

function tag(layer, text, cls, color) {
  layer.bindTooltip(text, { permanent: true, direction: 'right', offset: [14, 0], className: 'tag ' + (cls || '') });
  if (color) layer.getTooltip().getElement().style.color = color;
}

// p: { ahead, beyond: [[lat,lon]], safe, dest: [lat,lon]|null, pins: [{id,lat,lon,color,label,name,top,pick}], fit }
function show(p) {
  plan.clearLayers();
  L.polyline(p.beyond, { color: '#B9C3D3', weight: 8, opacity: .9 }).addTo(plan);
  L.polyline(p.ahead, { color: '#fff', weight: 12 }).addTo(plan);
  L.polyline(p.ahead, { color: '#10285A', weight: 7 }).addTo(plan);
  var pins = p.pins.slice().sort(function (a, b) { return a.pick - b.pick || b.rank - a.rank; });
  pins.forEach(function (s) {
    var m = L.circleMarker([s.lat, s.lon], s.pick
      ? { radius: 14, color: '#fff', weight: 4, fillColor: '#10285A', fillOpacity: 1 }
      : { radius: s.top ? 9 : 6, color: '#fff', weight: 2, fillColor: s.color, fillOpacity: 1 }).addTo(plan);
    m.on('click', function () { OTW.pick(s.id); });
    s.marker = m;
  });
  // labels in priority order; declutter() hides the ones that would cover an earlier label
  pins.filter(function (s) { return s.pick; }).forEach(function (s) { tag(s.marker, s.label + '  ' + s.name, 'pick'); });
  if (p.safe) tag(L.circleMarker(p.safe, { radius: 8, color: '#fff', weight: 3, fillColor: '#DC3B3B', fillOpacity: 1 }).addTo(plan),
    'SafeRange 끝', 'note', '#DC3B3B');
  if (p.dest) tag(L.circleMarker(p.dest, { radius: 10, color: '#fff', weight: 3, fillColor: '#10285A', fillOpacity: 1 }).addTo(plan),
    '목적지', 'note', '#10285A');
  pins.filter(function (s) { return s.top && !s.pick; }).sort(function (a, b) { return a.rank - b.rank; })
    .forEach(function (s) { tag(s.marker, s.label, '', s.color); });
  overview = L.latLngBounds(p.ahead.concat(p.pins.map(function (s) { return [s.lat, s.lon]; })));
  if (p.fit) fitAll();
  later();
}

// the actual way off the road to the stop and back, from the router
var wanted = null; // a stop the driver tapped: frame its whole detour once it arrives
function detour(points) {
  leg.clearLayers();
  if (!points.length) return;
  L.polyline(points, { color: '#fff', weight: 11 }).addTo(leg);
  L.polyline(points, { color: '#F97316', weight: 6 }).addTo(leg);
  if (wanted) map.fitBounds(L.latLngBounds(points).extend(wanted), { paddingTopLeft: [60, 100], paddingBottomRight: [60, 50], maxZoom: 16 });
  wanted = null;
}

function car(lat, lon) {
  if (!carDot) carDot = L.circleMarker([lat, lon], { radius: 11, color: '#fff', weight: 4, fillColor: '#2563EB', fillOpacity: 1 }).addTo(map);
  carDot.setLatLng([lat, lon]).bringToFront();
}

function focus(lat, lon) { wanted = [lat, lon]; map.flyTo(wanted, 15, { duration: .8 }); }

function fitAll() { if (overview && overview.isValid()) map.fitBounds(overview, { paddingTopLeft: [40, 80], paddingBottomRight: [40, 40] }); }
document.getElementById('all').onclick = fitAll;

function declutter() {
  var placed = [];
  document.querySelectorAll('.leaflet-tooltip').forEach(function (el) {
    el.style.visibility = 'visible';
    var r = el.getBoundingClientRect();
    var hit = placed.some(function (q) { return r.left < q.right && r.right > q.left && r.top < q.bottom && r.bottom > q.top; });
    if (hit) el.style.visibility = 'hidden'; else placed.push(r);
  });
}
// measured mid-animation the labels all overlap, so wait for the map to settle
var settle = 0;
function later() { clearTimeout(settle); settle = setTimeout(declutter, 120); }
map.on('zoomend moveend', later);
setInterval(declutter, 1000); // labels can still move after an event (late layout), so settle them again each second
</script>
</body>
</html>
